<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <script>
      window.arcWeb3Bridge = {
        config: null,

        initializeConfig: function (jsonStr) {
          this.config = JSON.parse(jsonStr);
          console.log("ArcWeb3 Loaded Network:", this.config.chainName);
        },

        switchNetwork: async function () {
          if (!this.config || !window.ethereum) return;
          const params = {
            chainId: this.config.chainIdHex,
            chainName: this.config.chainName,
            nativeCurrency: {
              name: this.config.currencyName,
              symbol: this.config.currencySymbol,
              decimals: this.config.currencyDecimals,
            },
            rpcUrls: [this.config.rpcUrl],
            blockExplorerUrls: [this.config.blockExplorerUrl],
          };

          try {
            await window.ethereum.request({
              method: "wallet_switchEthereumChain",
              params: [{ chainId: params.chainId }],
            });
          } catch (error) {
            if (error.code === 4902) {
              await window.ethereum.request({
                method: "wallet_addEthereumChain",
                params: [params],
              });
            } else {
              throw error;
            }
          }
        },

        connectWallet: async function () {
          if (!window.ethereum) {
            this.sendError("MetaMask not detected.");
            return;
          }
          try {
            await this.switchNetwork();
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            window.unityInstance.SendMessage(
              "ArcWeb3Manager",
              "JSCallback_WalletConnected",
              accounts[0],
            );
          } catch (err) {
            this.sendError(err.message);
          }
        },

        genericRead: async function (contractAddr, abiItem, method, args) {
          try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const contract = new ethers.Contract(
              contractAddr,
              [abiItem],
              provider,
            );
            const params = args ? args.split(",") : [];

            const result = await contract[method](...params);

            // Handle arrays (like getTokensByOwner)
            let resultStr =
              Array.isArray(result) ||
              result instanceof Float64Array ||
              result instanceof BigInt64Array
                ? Array.from(result)
                    .map((r) => r.toString())
                    .join(",")
                : result.toString();

            window.unityInstance.SendMessage(
              "ArcWeb3Manager",
              "JSCallback_ReadResult",
              method + "|" + resultStr,
            );
          } catch (err) {
            this.sendError("Read Error (" + method + "): " + err.message);
          }
        },

        genericWrite: async function (
          contractAddr,
          abiItem,
          method,
          args,
          value,
        ) {
          try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const contract = new ethers.Contract(
              contractAddr,
              [abiItem],
              signer,
            );
            const params = args ? args.split(",") : [];

            // Add value to overrides if transferring ETH
            const overrides =
              value !== "0" ? { value: ethers.parseEther(value) } : {};

            const tx = await contract[method](...params, overrides);
            const receipt = await tx.wait(); // Wait for mining confirmation

            window.unityInstance.SendMessage(
              "ArcWeb3Manager",
              "JSCallback_TxResult",
              method + "|" + receipt.hash,
            );
          } catch (err) {
            this.sendError("Write Error (" + method + "): " + err.message);
          }
        },

        sendError: function (msg) {
          console.error("[ArcWeb3]", msg);
          if (window.unityInstance) {
            window.unityInstance.SendMessage(
              "ArcWeb3Manager",
              "JSCallback_Error",
              msg,
            );
          }
        },
      };
    </script>

    <script>
            // --- UNITY WEBGL CONFIG ---
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
            var config = {
              dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
              frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
              codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      #if MEMORY_FILENAME
              memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
      #endif
      #if SYMBOLS_FILENAME
              symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
      #endif
              streamingAssetsUrl: "StreamingAssets",
              companyName: "{{{ COMPANY_NAME }}}",
              productName: "{{{ PRODUCT_NAME }}}",
              productVersion: "{{{ PRODUCT_VERSION }}}",
            };

            var container = document.querySelector("#unity-container");
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var fullscreenButton = document.querySelector("#unity-fullscreen-button");
            var width0 = "{{{ WIDTH }}}px";
            var height0 = "{{{ HEIGHT }}}px";

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
              container.className = "unity-mobile";
              config.devicePixelRatio = 1;
            } else {
              canvas.style.width = "{{{ WIDTH }}}px";
              canvas.style.height = "{{{ HEIGHT }}}px";
            }

      #if BACKGROUND_FILENAME
            canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
      #endif
            loadingBar.style.display = "block";

            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
              createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                // EXPOSE UNITY INSTANCE GLOBALLY
                window.unityInstance = unityInstance;

                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };
            document.body.appendChild(script);
    </script>
  </body>
</html>
